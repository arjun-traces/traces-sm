[package]
name = "traces-sm"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "traces-sm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comfy-table = "7"
colored = "2"
anyhow = "1"
