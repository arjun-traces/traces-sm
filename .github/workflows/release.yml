name: Release Desktop Application & Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release-binaries:
    name: Build Native Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: traces-sm-desktop-linux-x86_64
            binary_path: desktop/target/release/traces-sm-desktop
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: traces-sm-desktop-windows-x86_64.exe
            binary_path: desktop/target/release/traces-sm-desktop.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: traces-sm-desktop-macos-aarch64
            binary_path: desktop/target/release/traces-sm-desktop
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: traces-sm-desktop-macos-x86_64
            binary_path: desktop/target/release/traces-sm-desktop

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Release Desktop Application
        run: |
          cd desktop
          cargo build --release --target ${{ matrix.target }}

      - name: Prepare Binary Artifact Name
        shell: bash
        run: |
          mkdir -p release_assets
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp desktop/target/${{ matrix.target }}/release/traces-sm-desktop.exe release_assets/${{ matrix.artifact_name }}
          else
            cp desktop/target/${{ matrix.target }}/release/traces-sm-desktop release_assets/${{ matrix.artifact_name }}
          fi

      - name: Upload Binary Asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_assets/${{ matrix.artifact_name }}

  create-github-release:
    name: Create GitHub Release
    needs: build-release-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/

      - name: Consolidate Release Binaries
        run: |
          mkdir -p release_dist
          find release_assets/ -type f -exec cp {} release_dist/ \;
          ls -la release_dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_dist/*
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || inputs.version }}
          name: Release ${{ github.ref_name != 'main' && github.ref_name || inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
