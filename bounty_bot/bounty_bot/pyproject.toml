[project]
name = "bounty-bot"
version = "0.1.0"
description = "AI Bot to discover, parse, aggregate, and publish Security Research & Vulnerability Bounties"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "google-genai>=0.1.0",
    "feedparser>=6.0.0",
    "jinja2>=3.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
