[package]
name = "traces-sm-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "traces-sm-desktop"
path = "src/main.rs"

[dependencies]
eframe = "0.28"
egui = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
