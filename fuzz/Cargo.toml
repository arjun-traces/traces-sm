[package]
name = "traces-sm-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ring = "0.17"
traces_sm_enclave = { package = "traces-sm-enclave", path = "../enclave" }

[[bin]]
name = "fuzz_asn1"
path = "fuzz_targets/fuzz_asn1.rs"
test = false
doc = false

[[bin]]
name = "fuzz_json_rpc"
path = "fuzz_targets/fuzz_json_rpc.rs"
test = false
doc = false

[[bin]]
name = "fuzz_base64"
path = "fuzz_targets/fuzz_base64.rs"
test = false
doc = false
