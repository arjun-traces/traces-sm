[package]
name = "traces-sm-enclave"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "traces-sm-enclave"
path = "src/main.rs"

[dependencies]
# ---------------------------------------------------------------------------
# Core SGX / system
# ---------------------------------------------------------------------------
sgx-isa       = { version = "0.4", optional = true }   # EGETKEY on real HW

# ---------------------------------------------------------------------------
# Core cryptography
# ---------------------------------------------------------------------------
ring          = "0.17"
rsa           = { version = "0.9", features = ["sha2", "pem"] }

# ---------------------------------------------------------------------------
# ZKP — Schnorr / Pedersen / Bulletproofs  (dalek ecosystem)
# ---------------------------------------------------------------------------
curve25519-dalek  = { version = "4", default-features = false, features = ["alloc", "rand_core", "digest"] }
schnorrkel        = { version = "0.11", default-features = false, features = ["std", "preaudit_deprecated"] }
bulletproofs      = { version = "4", default-features = false, features = ["std"] }
merlin            = { version = "3", default-features = false, features = ["std"] }

# ---------------------------------------------------------------------------
# ZK-SNARKs (arkworks)
# ---------------------------------------------------------------------------
ark-groth16   = { version = "0.4", default-features = false, features = ["r1cs"] }
ark-bn254     = { version = "0.4", default-features = false }
ark-relations = { version = "0.4", default-features = false }
ark-std       = { version = "0.4", default-features = false, features = ["std"] }
ark-ff        = { version = "0.4", default-features = false, features = ["std"] }
ark-ec        = { version = "0.4", default-features = false, features = ["std"] }

# ---------------------------------------------------------------------------
# Homomorphic Encryption (Paillier — big-integer arithmetic)
# ---------------------------------------------------------------------------
num-bigint    = { version = "0.4", features = ["rand"] }
num-traits    = "0.2"
num-integer   = "0.1"
num-prime     = "0.4"        # Miller-Rabin primality for Paillier keygen

# ---------------------------------------------------------------------------
# TLS / HTTP
# ---------------------------------------------------------------------------
rustls        = { version = "0.23", features = ["ring"] }
rcgen         = "0.13"
httparse      = "1"

# ---------------------------------------------------------------------------
# Serialization / encoding
# ---------------------------------------------------------------------------
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
base64        = "0.22"
hex           = "0.4"

# ---------------------------------------------------------------------------
# Utilities
# ---------------------------------------------------------------------------
uuid          = { version = "1", features = ["v4", "serde"] }
rand          = "0.8"
rand_core     = "0.6"
zeroize       = { version = "1", features = ["derive"] }
thiserror     = "1"
once_cell     = "1"
anyhow        = "1"
log           = "0.4"
env_logger    = "0.11"
sha2          = "0.10"
hmac          = "0.12"
chrono        = { version = "0.4", features = ["serde"] }

[features]
default = []
# Enable real SGX hardware sealing via EGETKEY
sgx-hw = ["sgx-isa"]

[profile.release]
opt-level  = 3
lto        = "thin"
panic      = "abort"
strip      = "debuginfo"

[profile.dev]
panic = "abort"


